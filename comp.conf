# Copy to ~/.config/aetherwm/comp.conf
# The compositor is opt-in while the XRender path is being stabilized.
enabled = false

# Rounded corners are applied only when the compositor is enabled.
corner_radius = 12

# Translucent windows enable XRender backdrop blur when supported.
blur = false
opacity = 100

# Layered shadows never draw a window border or outline.
shadow = false
shadow_opacity = 28

# Eased zoom, opening, closing, and spatial cell transitions.
animations = false
animation_duration_ms = 140
