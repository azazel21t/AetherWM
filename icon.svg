<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- Aurora Blue Glow -->
    <linearGradient id="blueBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <!-- Aurora Green Glow -->
    <linearGradient id="greenBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2b3346" stroke-width="8" />

  <!-- Aurora Streaks / Window Tiling Lines -->
  <g filter="url(#glow)">
    <!-- Blue Ribbon -->
    <path d="M 80 360 Q 220 200 440 120" fill="none" stroke="url(#blueBeam)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Green Ribbon -->
    <path d="M 70 410 Q 250 260 450 170" fill="none" stroke="url(#greenBeam)" stroke-width="28" stroke-linecap="round" />

    <!-- Sharp Core Tiling Accent Line -->
    <path d="M 90 310 Q 200 180 420 90" fill="none" stroke="#7ee787" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
