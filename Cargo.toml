[package]
name = "aetherwm"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"       # Optimize strictly for size
lto = true            # Enable link-time optimization across all crates
codegen-units = 1     # Maximizes LTO efficiency
panic = "abort"       # Removes heavy stack-unwinding code
strip = true          # Strips out all debug symbols automatically
